<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: #1a1a2e;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 90%;
      max-width: 400px;
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 2.5rem;
      color: #00fff5;
      text-shadow: 0 0 10px rgba(0, 255, 245, 0.4);
    }

    /* Mode & Difficulty Selectors */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      margin-bottom: 20px;
    }

    .btn-group {
      display: flex;
      background: #16213e;
      border-radius: 10px;
      padding: 4px;
    }

    .mode-btn, .diff-btn {
      flex: 1;
      padding: 8px 12px;
      border: none;
      background: transparent;
      color: #a0a0a0;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active, .diff-btn.active {
      background: #0f3460;
      color: #00fff5;
      box-shadow: 0 0 10px rgba(0, 255, 245, 0.2);
    }

    /* Scoreboard */
    .scoreboard {
      display: flex;
      justify-content: space-around;
      width: 100%;
      background: #16213e;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-box {
      display: flex;
      flex-direction: column;
    }

    .score-box .label {
      font-size: 0.8rem;
      color: #a0a0a0;
    }

    .score-box .value {
      font-size: 1.4rem;
      font-weight: bold;
      margin-top: 2px;
    }

    .score-x { color: #ff2e63; }
    .score-o { color: #00fff5; }
    .score-ties { color: #f8b500; }

    /* Game Board */
    .status {
      font-size: 1.1rem;
      margin-bottom: 15px;
      height: 25px;
      font-weight: 600;
      color: #e94560;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      aspect-ratio: 1;
      background: #16213e;
      padding: 10px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .cell {
      background: #0f3460;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 3rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .cell:hover {
      background: #1f4068;
    }

    .cell:active {
      transform: scale(0.95);
    }

    .cell.x { color: #ff2e63; }
    .cell.o { color: #00fff5; }

    .cell.winner {
      background: #e94560;
      color: #fff;
      animation: pulse 0.6s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }

    /* Action Buttons */
    .reset-btn {
      margin-top: 20px;
      padding: 12px 30px;
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #e94560, #ff2e63);
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
      transition: all 0.2s ease;
    }

    .reset-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Tic-Tac-Toe</h1>

    <div class="controls">
      <div class="btn-group">
        <button class="mode-btn active" id="btnPvp">2 Player</button>
        <button class="mode-btn" id="btnAi">vs Computer</button>
      </div>

      <div class="btn-group" id="diffGroup" style="display: none;">
        <button class="diff-btn" id="diffEasy">Easy</button>
        <button class="diff-btn active" id="diffMedium">Medium</button>
        <button class="diff-btn" id="diffHard">Unbeatable</button>
      </div>
    </div>

    <div class="scoreboard">
      <div class="score-box">
        <span class="label">Player (X)</span>
        <span class="value score-x" id="scoreX">0</span>
      </div>
      <div class="score-box">
        <span class="label">Ties</span>
        <span class="value score-ties" id="scoreTies">0</span>
      </div>
      <div class="score-box">
        <span class="label" id="oLabel">Player (O)</span>
        <span class="value score-o" id="scoreO">0</span>
      </div>
    </div>

    <div class="status" id="statusText">Player X's Turn</div>

    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <button class="reset-btn" id="resetBtn">Restart Match</button>
  </div>

  <script>
    // Audio Synthesizer
    let audioCtx;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'x') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'o') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(500, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'win') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    // Game Logic State
    let boardState = Array(9).fill('');
    let currentPlayer = 'X';
    let gameActive = true;
    let isVsAi = false;
    let aiDifficulty = 'medium'; // easy, medium, hard
    let scores = { X: 0, O: 0, ties: 0 };

    const WINNING_COMBOS = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
      [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
      [0, 4, 8], [2, 4, 6]             // Diagonals
    ];

    // Elements
    const cells = document.querySelectorAll('.cell');
    const statusText = document.getElementById('statusText');
    const scoreXEl = document.getElementById('scoreX');
    const scoreOEl = document.getElementById('scoreO');
    const scoreTiesEl = document.getElementById('scoreTies');
    const oLabel = document.getElementById('oLabel');
    const diffGroup = document.getElementById('diffGroup');

    // Handle Clicks
    function handleCellClick(e) {
      initAudio();
      const index = e.target.getAttribute('data-index');

      if (boardState[index] !== '' || !gameActive) return;

      makeMove(index, currentPlayer);

      if (gameActive && isVsAi && currentPlayer === 'O') {
        setTimeout(makeAiMove, 300);
      }
    }

    function makeMove(index, player) {
      boardState[index] = player;
      cells[index].innerText = player;
      cells[index].classList.add(player.toLowerCase());
      playSound(player.toLowerCase());

      const winCombo = checkWin(boardState, player);

      if (winCombo) {
        endGame(false, winCombo);
      } else if (boardState.every(cell => cell !== '')) {
        endGame(true);
      } else {
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        statusText.innerText = isVsAi && currentPlayer === 'O' 
          ? "Computer is thinking..." 
          : `Player ${currentPlayer}'s Turn`;
      }
    }

    function checkWin(board, player) {
      return WINNING_COMBOS.find(combo => {
        return combo.every(index => board[index] === player);
      });
    }

    function endGame(isTie, winCombo = null) {
      gameActive = false;
      if (isTie) {
        statusText.innerText = "It's a Draw!";
        scores.ties++;
        scoreTiesEl.innerText = scores.ties;
      } else {
        const winnerName = isVsAi ? (currentPlayer === 'X' ? 'Player' : 'Computer') : `Player ${currentPlayer}`;
        statusText.innerText = `${winnerName} Wins!`;
        scores[currentPlayer]++;
        if (currentPlayer === 'X') scoreXEl.innerText = scores.X;
        else scoreOEl.innerText = scores.O;

        winCombo.forEach(index => cells[index].classList.add('winner'));
        playSound('win');
      }
    }

    // AI Logic
    function makeAiMove() {
      if (!gameActive) return;

      let moveIndex;

      if (aiDifficulty === 'easy') {
        moveIndex = getRandomMove();
      } else if (aiDifficulty === 'medium') {
        // 50% chance optimal, 50% chance random
        moveIndex = Math.random() < 0.5 ? getBestMove() : getRandomMove();
      } else {
        // Unbeatable Minimax
        moveIndex = getBestMove();
      }

      if (moveIndex !== undefined && moveIndex !== null) {
        makeMove(moveIndex, 'O');
      }
    }

    function getRandomMove() {
      const available = boardState.map((val, idx) => val === '' ? idx : null).filter(val => val !== null);
      return available[Math.floor(Math.random() * available.length)];
    }

    function getBestMove() {
      let bestScore = -Infinity;
      let move;
      for (let i = 0; i < 9; i++) {
        if (boardState[i] === '') {
          boardState[i] = 'O';
          let score = minimax(boardState, 0, false);
          boardState[i] = '';
          if (score > bestScore) {
            bestScore = score;
            move = i;
          }
        }
      }
      return move;
    }

    function minimax(board, depth, isMaximizing) {
      if (checkWin(board, 'O')) return 10 - depth;
      if (checkWin(board, 'X')) return depth - 10;
      if (board.every(cell => cell !== '')) return 0;

      if (isMaximizing) {
        let bestScore = -Infinity;
        for (let i = 0; i < 9; i++) {
          if (board[i] === '') {
            board[i] = 'O';
            let score = minimax(board, depth + 1, false);
            board[i] = '';
            bestScore = Math.max(score, bestScore);
          }
        }
        return bestScore;
      } else {
        let bestScore = Infinity;
        for (let i = 0; i < 9; i++) {
          if (board[i] === '') {
            board[i] = 'X';
            let score = minimax(board, depth + 1, true);
            board[i] = '';
            bestScore = Math.min(score, bestScore);
          }
        }
        return bestScore;
      }
    }

    // Reset Match
    function resetMatch() {
      boardState = Array(9).fill('');
      currentPlayer = 'X';
      gameActive = true;
      statusText.innerText = "Player X's Turn";

      cells.forEach(cell => {
        cell.innerText = '';
        cell.className = 'cell';
      });
    }

    // Mode Switches
    document.getElementById('btnPvp').addEventListener('click', (e) => {
      setMode(false, e.target);
    });

    document.getElementById('btnAi').addEventListener('click', (e) => {
      setMode(true, e.target);
    });

    function setMode(vsAi, targetBtn) {
      isVsAi = vsAi;
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      targetBtn.classList.add('active');

      diffGroup.style.display = vsAi ? 'flex' : 'none';
      oLabel.innerText = vsAi ? 'Computer (O)' : 'Player (O)';

      scores = { X: 0, O: 0, ties: 0 };
      scoreXEl.innerText = '0';
      scoreOEl.innerText = '0';
      scoreTiesEl.innerText = '0';

      resetMatch();
    }

    // Difficulty Listeners
    ['Easy', 'Medium', 'Hard'].forEach(diff => {
      document.getElementById(`diff${diff}`).addEventListener('click', (e) => {
        aiDifficulty = diff.toLowerCase();
        document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
        e.target.classList.add('active');
        resetMatch();
      });
    });

    cells.forEach(cell => cell.addEventListener('click', handleCellClick));
    document.getElementById('resetBtn').addEventListener('click', resetMatch);
  </script>
</body>
</html>
