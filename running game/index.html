<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ninja Runner - Full Screen Edition</title>
  <style>
    * {
      box-sizing: border-box;
    }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* Prevents bounce scroll bars */
      background: #87CEEB;
      font-family: Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Game wrapper occupies whole display viewport */
    .game-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 60%, #e0f7fa 100%);
    }

    /* Text Instruction Banner overlayed cleanly at top */
    .instructions {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      color: #2c3e50;
      background: rgba(255, 255, 255, 0.6);
      padding: 6px 15px;
      border-radius: 20px;
      font-size: 14px;
      margin: 0;
      pointer-events: none; /* Allows click throughs */
      font-weight: bold;
      z-index: 2;
    }

    /* Fixed Layout positions for centered popups */
    #gameStart, #gameOver {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.95);
      padding: 30px 40px;
      border: 3px solid #2c3e50;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      width: 85%;
      max-width: 340px;
      text-align: center;
      z-index: 10;
    }

    .hidden {
      display: none !important;
    }

    .action-btn {
      padding: 12px 28px;
      font-size: 18px;
      cursor: pointer;
      background-color: #27ae60;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      box-shadow: 0 4px 0 #1e7e43;
      transition: all 0.1s;
    }

    .action-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #1e7e43;
    }

    /* Translucent Arcade HUD Jump Trigger on top of Canvas */
    .jump-btn-overlay {
      position: absolute;
      bottom: 30px;
      right: 30px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background-color: rgba(231, 76, 60, 0.8);
      color: white;
      border: 4px solid rgba(192, 57, 43, 0.9);
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 6px 0 rgba(150, 45, 34, 0.8);
      cursor: pointer;
      outline: none;
      z-index: 5;
      transform: translateZ(0); /* Hardware accelerated */
      -webkit-tap-highlight-color: transparent;
    }

    .jump-btn-overlay:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(150, 45, 34, 0.8);
    }
  </style>
</head>
<body>

  <div class="game-container">
    <p class="instructions">Press <strong>"S"</strong> or Tap the Red Circle!</p>
    
    <canvas id="gameCanvas"></canvas>

    <div id="gameStart">
      <h2 style="color:#2c3e50; margin-top:0;">Ninja Runner</h2>
      <p style="color:#7f8c8d;">Leap cleanly over incoming spikes.</p>
      <button class="action-btn" id="startBtn">Start Game</button>
    </div>

    <div id="gameOver" class="hidden">
      <h2 style="color:#c0392b; margin-top:0;">Game Over</h2>
      <p id="scoreText" style="font-size:18px; font-weight:bold; color:#2c3e50;"></p>
      <button class="action-btn" id="restartBtn">Run Again</button>
    </div>

    <button class="jump-btn-overlay" id="mobileJumpBtn">JUMP</button>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Dynamic Viewport Resize calculations
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Responsive positioning coordinates anchor logic
    function getGroundY() {
      return canvas.height * 0.75; // Ground line stays 75% down the window height
    }

    let audioCtx;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playJumpSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "square"; 
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    function playCrashSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(260, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.4);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);
    }

    // Dynamic Physics/Entity parameters
    let player = {
      x: 60,
      y: 0, 
      width: 32,
      height: 48,
      dy: 0,
      gravity: 0.65,
      jumpPower: -13,
      grounded: true,
      animFrame: 0 
    };

    let obstacle = {
      x: 0,
      y: 0,
      width: 26,
      height: 32,
      speed: 6
    };

    // Initialize placement positioning safely on loading frames
    player.y = getGroundY() - player.height;
    obstacle.x = canvas.width + 100;
    obstacle.y = getGroundY() - obstacle.height + 15; // slightly clipped into ground line

    let score = 0;
    let gameRunning = false; 
    let animationFrameId;

    function drawPlayer() {
      if (player.grounded && gameRunning) {
        player.animFrame += 0.22; 
      }

      ctx.save();
      ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
      if (player.grounded && gameRunning) {
        ctx.rotate(0.06); 
      }
      ctx.translate(-(player.x + player.width / 2), -(player.y + player.height / 2));

      // Robe
      ctx.fillStyle = "#2980b9";
      ctx.fillRect(player.x, player.y + 12, player.width, player.height - 22);

      // Mask/Face
      ctx.fillStyle = "#f39c12";
      ctx.beginPath();
      ctx.arc(player.x + player.width / 2, player.y + 11, 10, 0, Math.PI * 2);
      ctx.fill();

      // Bandana
      ctx.fillStyle = "#e74c3c";
      ctx.fillRect(player.x, player.y + 5, player.width, 4);
      ctx.beginPath();
      ctx.moveTo(player.x, player.y + 7);
      let tailWiggle = player.grounded ? Math.sin(player.animFrame) * 4 : 2;
      ctx.lineTo(player.x - 12, player.y + 5 + tailWiggle);
      ctx.lineTo(player.x - 6, player.y + 11);
      ctx.fill();

      // Eyes
      ctx.fillStyle = "white";
      ctx.fillRect(player.x + player.width / 2 + 2, player.y + 8, 4, 4);
      ctx.fillStyle = "black";
      ctx.fillRect(player.x + player.width / 2 + 4, player.y + 8, 2, 4);

      // Rigging Vector Legs Animation
      ctx.strokeStyle = "#2c3e50";
      ctx.lineWidth = 4;
      ctx.lineCap = "round";

      let currentCycle = Math.floor(player.animFrame) % 4;

      if (!player.grounded) {
        ctx.beginPath(); ctx.moveTo(player.x + 10, player.y + 36); ctx.lineTo(player.x + 4, player.y + 44); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(player.x + 22, player.y + 36); ctx.lineTo(player.x + 26, player.y + 42); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(player.x + 16, player.y + 20); ctx.lineTo(player.x - 4, player.y + 11); ctx.stroke();
      } else {
        if (currentCycle === 0) {
          ctx.beginPath(); ctx.moveTo(player.x + 10, player.y + 36); ctx.lineTo(player.x + 2, player.y + 49); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(player.x + 22, player.y + 36); ctx.lineTo(player.x + 28, player.y + 49); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(player.x + 16, player.y + 18); ctx.lineTo(player.x + 26, player.y + 26); ctx.stroke();
        } else if (currentCycle === 1) {
          ctx.beginPath(); ctx.moveTo(player.x + 12, player.y + 36); ctx.lineTo(player.x + 8, player.y + 47); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(player.x + 20, player.y + 36); ctx.lineTo(player.x + 22, player.y + 47); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(player.x + 16, player.y + 18); ctx.lineTo(player.x + 16, player.y + 28); ctx.stroke();
        } else if (currentCycle === 2) {
          ctx.beginPath(); ctx.moveTo(player.x + 10, player.y + 36); ctx.lineTo(player.x + 25, player.y + 49); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(player.x + 22, player.y + 36); ctx.lineTo(player.x + 5, player.y + 49); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(player.x + 16, player.y + 18); ctx.lineTo(player.x + 4, player.y + 26); ctx.stroke();
        } else {
          ctx.beginPath(); ctx.moveTo(player.x + 10, player.y + 36); ctx.lineTo(player.x + 15, player.y + 47); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(player.x + 22, player.y + 36); ctx.lineTo(player.x + 15, player.y + 47); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(player.x + 16, player.y + 18); ctx.lineTo(player.x + 16, player.y + 28); ctx.stroke();
        }
      }
      ctx.restore();
    }

    function drawObstacle() {
      ctx.fillStyle = "#27ae60";
      // Cluster Spikes Geometry pathing
      ctx.beginPath();
      ctx.moveTo(obstacle.x + obstacle.width / 2, obstacle.y);
      ctx.lineTo(obstacle.x, obstacle.y + obstacle.height);
      ctx.lineTo(obstacle.x + obstacle.width, obstacle.y + obstacle.height);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(obstacle.x, obstacle.y + 10);
      ctx.lineTo(obstacle.x - 9, obstacle.y + obstacle.height);
      ctx.lineTo(obstacle.x, obstacle.y + obstacle.height);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(obstacle.x + obstacle.width, obstacle.y + 12);
      ctx.lineTo(obstacle.x + obstacle.width + 9, obstacle.y + obstacle.height);
      ctx.lineTo(obstacle.x + obstacle.width, obstacle.y + obstacle.height);
      ctx.fill();
    }

    function drawGround() {
      const currentGroundY = getGroundY();
      
      // Horizon Border
      ctx.strokeStyle = "#7f8c8d";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(0, currentGroundY + player.height);
      ctx.lineTo(canvas.width, currentGroundY + player.height);
      ctx.stroke();

      // Earth floor
      ctx.fillStyle = "#95a5a6";
      ctx.fillRect(0, currentGroundY + player.height + 2, canvas.width, canvas.height);
    }

    function updatePlayer() {
      const targetGround = getGroundY();
      player.dy += player.gravity;
      player.y += player.dy;

      if (player.y >= targetGround) {
        player.y = targetGround;
        player.dy = 0;
        player.grounded = true;
      }
    }

    function updateObstacle() {
      obstacle.x -= obstacle.speed;

      // Wrap check off-screen boundaries
      if (obstacle.x < -obstacle.width - 20) {
        obstacle.x = canvas.width + Math.random() * window.innerWidth * 0.3;
        score++;
        
        if (score % 4 === 0) {
          obstacle.speed += 0.65; // Scale velocity parameters incrementally
        }
      }
    }

    function checkCollision() {
      if (
        player.x < obstacle.x + obstacle.width &&
        player.x + player.width > obstacle.x &&
        player.y < obstacle.y + obstacle.height &&
        player.y + player.height > obstacle.y
      ) {
        endGame();
      }
    }

    function gameLoop() {
      if (!gameRunning) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawGround();
      updatePlayer();
      updateObstacle();
      checkCollision();

      drawPlayer();
      drawObstacle();

      // Modern dynamic scale vector display font properties
      ctx.fillStyle = "#2c3e50";
      ctx.font = "bold 22px Arial";
      ctx.fillText("Score: " + score, 25, 45);

      animationFrameId = requestAnimationFrame(gameLoop);
    }

    function jump() {
      if (player.grounded && gameRunning) {
        player.dy = player.jumpPower;
        player.grounded = false;
        playJumpSound();
      }
    }

    function startGame() {
      initAudio();
      document.getElementById("gameStart").classList.add("hidden");
      gameRunning = true;
      
      // Standardize positions on fresh launch frame runs
      const currentGround = getGroundY();
      player.y = currentGround;
      obstacle.x = canvas.width + 50;
      obstacle.y = currentGround + 15;
      
      gameLoop();
    }

    // Global Key Events
    document.addEventListener("keydown", (e) => {
      if (e.key === "s" || e.key === "S") {
        e.preventDefault(); 
        jump();
      }
    });

    const jumpButton = document.getElementById("mobileJumpBtn");
    jumpButton.addEventListener("touchstart", (e) => { e.preventDefault(); jump(); });
    jumpButton.addEventListener("mousedown", (e) => { e.preventDefault(); jump(); });

    function endGame() {
      gameRunning = false;
      cancelAnimationFrame(animationFrameId);
      playCrashSound(); 
      document.getElementById("gameOver").classList.remove("hidden");
      document.getElementById("scoreText").innerText = "Final Score: " + score;
    }

    function restartGame() {
      cancelAnimationFrame(animationFrameId);
      const targetGround = getGroundY();
      player.y = targetGround;
      player.dy = 0;
      player.animFrame = 0;
      obstacle.x = canvas.width + 50;
      obstacle.y = targetGround + 15;
      obstacle.speed = 6; 
      score = 0;
      gameRunning = true;
      document.getElementById("gameOver").classList.add("hidden");
      gameLoop();
    }

    document.getElementById("startBtn").addEventListener("click", startGame);
    document.getElementById("restartBtn").addEventListener("click", restartGame);

    // Render an initial idle scenic setup frame on entry
    setTimeout(() => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGround();
      drawPlayer();
    }, 100);
  </script>
</body>
</html>
